_format_version: "3.0"

services:
  - name: auth
    url: http://auth:9999
    routes:
      - name: auth-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  - name: rest
    url: http://rest:3000
    routes:
      - name: rest-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors

  - name: storage
    url: http://storage:5000
    routes:
      - name: storage-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

  - name: backend
    url: http://backend:3001
    routes:
      - name: backend-all
        strip_path: false
        paths:
          - /api/
    plugins:
      - name: cors

  - name: web
    url: http://web:3000
    routes:
      - name: web-all
        strip_path: false
        paths:
          - /
    plugins:
      - name: cors

plugins:
  - name: cors
    config:
      origins:
        - '*'
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Encoding
        - Authorization
        - Content-Type
        - Origin
        - X-Client-Info
        - X-Requested-With
      exposed_headers:
        - X-Total-Count
      credentials: true
      max_age: 3600
