name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}

      - name: Debug - Check standalone structure
        run: |
          echo "=== Checking standalone output ==="
          ls -la apps/web/.next/standalone/ || echo "No standalone directory"
          find apps/web/.next/standalone -name "server.js" -type f || echo "No server.js found"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mockpilot-backend:staging
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mockpilot-backend:staging
          cache-to: type=inline

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mockpilot-web:staging
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mockpilot-web:staging
          cache-to: type=inline

      - name: Copy docker-compose to staging server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          source: "docker-compose.staging.yml,kong.yml,init/"
          target: "~/mockpilot"

      - name: Create staging .env file on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            cd ~/mockpilot
            cat > .env << 'EOF'
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            STAGING_POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}
            STAGING_POSTGRES_DB=postgres
            STAGING_JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
            STAGING_ANON_KEY=${{ secrets.STAGING_ANON_KEY }}
            STAGING_SERVICE_ROLE_KEY=${{ secrets.STAGING_SERVICE_ROLE_KEY }}
            STAGING_API_EXTERNAL_URL=${{ secrets.STAGING_API_EXTERNAL_URL }}
            STAGING_SITE_URL=${{ secrets.STAGING_SITE_URL }}
            STAGING_ALLOWED_ORIGINS=${{ secrets.STAGING_ALLOWED_ORIGINS }}
            STAGING_RESEND_API_KEY=${{ secrets.STAGING_RESEND_API_KEY }}
            STAGING_SMTP_ADMIN_EMAIL=${{ secrets.STAGING_SMTP_ADMIN_EMAIL }}
            EOF

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            cd ~/mockpilot
            docker-compose -f docker-compose.staging.yml pull
            docker-compose -f docker-compose.staging.yml up -d --force-recreate

      - name: Deploy Notification
        if: always()
        run: echo "Staging deployment completed"
