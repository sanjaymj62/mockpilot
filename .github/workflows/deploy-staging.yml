name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose to staging server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          source: "package.json,pnpm-lock.yaml,packages/,apps/,docker-compose.staging.yml,kong.yml"
          target: "~/mockpilot"

      - name: Create staging .env file on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            cd ~/mockpilot
            cat > .env << 'EOF'
            STAGING_POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}
            STAGING_POSTGRES_DB=postgres
            STAGING_JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
            STAGING_ANON_KEY=${{ secrets.STAGING_ANON_KEY }}
            STAGING_SERVICE_ROLE_KEY=${{ secrets.STAGING_SERVICE_ROLE_KEY }}
            STAGING_API_EXTERNAL_URL=https://staging.yourdomain.com
            STAGING_SITE_URL=https://staging.yourdomain.com
            STAGING_ALLOWED_ORIGINS=https://staging.yourdomain.com
            EOF

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            cd ~/mockpilot
            docker-compose -f docker-compose.staging.yml up -d --build

      - name: Deploy Notification
        if: always()
        run: echo "Staging deployment completed"
