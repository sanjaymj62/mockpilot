name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules for Docker
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/backend/node_modules
            packages/core/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build packages
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.STAGING_BACKEND_URL }}
          NEXT_PUBLIC_DODO_PRODUCT_TEAM: ${{ secrets.STAGING_DODO_PRODUCT_TEAM }}
          NEXT_PUBLIC_DODO_PRODUCT_PRO: ${{ secrets.STAGING_DODO_PRODUCT_PRO }}

      - name: Debug - Check standalone structure
        run: |
          echo "=== Checking standalone output ==="
          ls -la apps/web/.next/standalone/ || echo "No standalone directory"
          find apps/web/.next/standalone -name "server.js" -type f || echo "No server.js found"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mockpilot-backend:staging
          no-cache: true

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mockpilot-web:staging
          no-cache: true

      - name: Copy docker-compose to staging server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          source: "docker-compose.staging.yml,kong.yml,init/,supabase/migrations/"
          target: "~/mockpilot"

      - name: Create staging .env file on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            cd ~/mockpilot
            cat > .env <<EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            STAGING_POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}
            STAGING_POSTGRES_DB=postgres
            STAGING_JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
            STAGING_ANON_KEY=${{ secrets.STAGING_ANON_KEY }}
            STAGING_SERVICE_ROLE_KEY=${{ secrets.STAGING_SERVICE_ROLE_KEY }}
            STAGING_API_EXTERNAL_URL=${{ secrets.STAGING_API_EXTERNAL_URL }}
            STAGING_SITE_URL=${{ secrets.STAGING_SITE_URL }}
            STAGING_ALLOWED_ORIGINS=${{ secrets.STAGING_ALLOWED_ORIGINS }}
            STAGING_RESEND_API_KEY=${{ secrets.STAGING_RESEND_API_KEY }}
            STAGING_SMTP_ADMIN_EMAIL=${{ secrets.STAGING_SMTP_ADMIN_EMAIL }}
            STAGING_DODO_API_KEY=${{ secrets.STAGING_DODO_API_KEY }}
            STAGING_DODO_WEBHOOK_SECRET=${{ secrets.STAGING_DODO_WEBHOOK_SECRET }}
            STAGING_DODO_PRICE_PRO=${{ secrets.STAGING_DODO_PRICE_PRO }}
            STAGING_DODO_PRICE_TEAM=${{ secrets.STAGING_DODO_PRICE_TEAM }}
            STAGING_DODO_PRODUCT_PRO=${{ secrets.STAGING_DODO_PRODUCT_PRO }}
            STAGING_DODO_PRODUCT_TEAM=${{ secrets.STAGING_DODO_PRODUCT_TEAM }}
            EOF
            echo "=== .env file created ==="
            echo "Checking critical env vars:"
            grep -E "^STAGING_DODO" .env || echo "No DODO vars found!"

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            cd ~/mockpilot
            echo "Pulling latest images..."
            docker pull --platform linux/arm64 sanjayjayaram/mockpilot-web:staging
            docker pull --platform linux/arm64 sanjayjayaram/mockpilot-backend:staging
            echo "Stopping old containers..."
            docker stop mockpilot-staging-web mockpilot-staging-backend 2>/dev/null || true
            docker rm mockpilot-staging-web mockpilot-staging-backend 2>/dev/null || true
            echo "Starting containers using docker-compose..."
            docker-compose -f docker-compose.staging.yml up -d backend web
            echo "Verifying containers..."
            docker ps | grep mockpilot
            sleep 10

      - name: Run database migrations
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            cd ~/mockpilot
            docker cp supabase/migrations/20260222000004_create_purchases.sql supabase-staging-db:/tmp/
            docker exec supabase-staging-db psql -U postgres -d postgres -f /tmp/20260222000004_create_purchases.sql || echo "Migration may already exist, continuing..."

      - name: Deploy Notification
        if: always()
        run: echo "Staging deployment completed"
