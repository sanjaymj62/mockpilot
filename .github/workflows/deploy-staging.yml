name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy project to staging server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          source: "."
          target: "~/mockpilot"
          exclude: ".git,.github,node_modules,.next,apps/backend/dist,apps/web/.next,packages/core/dist,*.log"

      - name: Create staging .env file on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            cd ~/mockpilot
            cat > .env <<EOF
            NEXT_PUBLIC_SUPABASE_URL=http://kong:8000
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.STAGING_ANON_KEY }}
            NEXT_PUBLIC_BACKEND_URL=http://91.98.125.157:3001
            NEXT_PUBLIC_DODO_PRODUCT_TEAM=${{ secrets.STAGING_DODO_PRODUCT_TEAM }}
            NEXT_PUBLIC_DODO_PRODUCT_PRO=${{ secrets.STAGING_DODO_PRODUCT_PRO }}
            STAGING_POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}
            STAGING_POSTGRES_DB=postgres
            STAGING_JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
            STAGING_ANON_KEY=${{ secrets.STAGING_ANON_KEY }}
            STAGING_SERVICE_ROLE_KEY=${{ secrets.STAGING_SERVICE_ROLE_KEY }}
            STAGING_API_EXTERNAL_URL=${{ secrets.STAGING_API_EXTERNAL_URL }}
            STAGING_SITE_URL=${{ secrets.STAGING_SITE_URL }}
            STAGING_ALLOWED_ORIGINS=${{ secrets.STAGING_ALLOWED_ORIGINS }}
            STAGING_RESEND_API_KEY=${{ secrets.STAGING_RESEND_API_KEY }}
            STAGING_SMTP_ADMIN_EMAIL=${{ secrets.STAGING_SMTP_ADMIN_EMAIL }}
            STAGING_DODO_API_KEY=${{ secrets.STAGING_DODO_API_KEY }}
            STAGING_DODO_WEBHOOK_SECRET=${{ secrets.STAGING_DODO_WEBHOOK_SECRET }}
            STAGING_DODO_PRICE_PRO=${{ secrets.STAGING_DODO_PRICE_PRO }}
            STAGING_DODO_PRICE_TEAM=${{ secrets.STAGING_DODO_PRICE_TEAM }}
            STAGING_DODO_PRODUCT_PRO=${{ secrets.STAGING_DODO_PRODUCT_PRO }}
            STAGING_DODO_PRODUCT_TEAM=${{ secrets.STAGING_DODO_PRODUCT_TEAM }}
            EOF

      - name: Install pnpm and build on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            cd ~/mockpilot
            corepack enable
            corepack prepare pnpm@10 --activate
            rm -rf apps/web/.next apps/backend/dist packages/core/dist
            pnpm install --frozen-lockfile
            set -a
            source .env
            set +a
            pnpm build

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            cd ~/mockpilot
            docker rm -f mockpilot-staging-backend mockpilot-staging-web 2>/dev/null || true
            DOCKER_BUILDKIT=0 docker compose -f docker-compose.staging.yml build
            docker compose -f docker-compose.staging.yml up -d

      - name: Run database migrations
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            cd ~/mockpilot
            docker cp supabase/migrations/20260222000004_create_purchases.sql supabase-staging-db:/tmp/
            docker exec supabase-staging-db psql -U postgres -d postgres -f /tmp/20260222000004_create_purchases.sql || echo "Migration may already exist, continuing..."

      - name: Deploy Notification
        if: always()
        run: echo "Staging deployment completed"
