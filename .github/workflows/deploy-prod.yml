name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_ANON_KEY }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.PROD_BACKEND_URL }}
          NEXT_PUBLIC_DODO_PRODUCT_TEAM: ${{ secrets.PROD_DODO_PRODUCT_TEAM }}
          NEXT_PUBLIC_DODO_PRODUCT_PRO: ${{ secrets.PROD_DODO_PRODUCT_PRO }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mockpilot-backend:prod
          no-cache: true

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mockpilot-web:prod
          no-cache: true

      - name: Copy docker-compose to prod server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          source: "docker-compose.prod.yml,kong.yml,init/,supabase/migrations/"
          target: "~/mockpilot"

      - name: Create prod .env file on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            cd ~/mockpilot
            cat > .env <<EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            PROD_POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
            PROD_POSTGRES_DB=postgres
            PROD_JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
            PROD_ANON_KEY=${{ secrets.PROD_ANON_KEY }}
            PROD_SERVICE_ROLE_KEY=${{ secrets.PROD_SERVICE_ROLE_KEY }}
            PROD_API_EXTERNAL_URL=${{ secrets.PROD_API_EXTERNAL_URL }}
            PROD_SITE_URL=${{ secrets.PROD_SITE_URL }}
            PROD_ALLOWED_ORIGINS=${{ secrets.PROD_ALLOWED_ORIGINS }}
            PROD_RESEND_API_KEY=${{ secrets.PROD_RESEND_API_KEY }}
            PROD_SMTP_ADMIN_EMAIL=${{ secrets.PROD_SMTP_ADMIN_EMAIL }}
            PROD_DODO_API_KEY=${{ secrets.PROD_DODO_API_KEY }}
            PROD_DODO_WEBHOOK_SECRET=${{ secrets.PROD_DODO_WEBHOOK_SECRET }}
            PROD_DODO_PRICE_PRO=${{ secrets.PROD_DODO_PRICE_PRO }}
            PROD_DODO_PRICE_TEAM=${{ secrets.PROD_DODO_PRICE_TEAM }}
            PROD_DODO_PRODUCT_PRO=${{ secrets.PROD_DODO_PRODUCT_PRO }}
            PROD_DODO_PRODUCT_TEAM=${{ secrets.PROD_DODO_PRODUCT_TEAM }}
            EOF

      - name: Deploy to prod server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            cd ~/mockpilot
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --force-recreate
            sleep 10

      - name: Run database migrations
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            cd ~/mockpilot
            docker cp supabase/migrations/20260222000004_create_purchases.sql supabase-prod-db:/tmp/
            docker exec supabase-prod-db psql -U postgres -d postgres -f /tmp/20260222000004_create_purchases.sql || echo "Migration may already exist, continuing..."

      - name: Deploy Notification
        if: always()
        run: echo "Production deployment completed"
