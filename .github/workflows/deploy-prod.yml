name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_ANON_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mockpilot-backend:prod
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mockpilot-backend:prod
          cache-to: type=inline

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mockpilot-web:prod
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mockpilot-web:prod
          cache-to: type=inline

      - name: Copy docker-compose to prod server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          source: "docker-compose.prod.yml,kong.yml,init/"
          target: "~/mockpilot"

      - name: Create prod .env file on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            cd ~/mockpilot
            cat > .env << 'EOF'
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            PROD_POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
            PROD_POSTGRES_DB=postgres
            PROD_JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
            PROD_ANON_KEY=${{ secrets.PROD_ANON_KEY }}
            PROD_SERVICE_ROLE_KEY=${{ secrets.PROD_SERVICE_ROLE_KEY }}
            PROD_API_EXTERNAL_URL=${{ secrets.PROD_API_EXTERNAL_URL }}
            PROD_SITE_URL=${{ secrets.PROD_SITE_URL }}
            PROD_ALLOWED_ORIGINS=${{ secrets.PROD_ALLOWED_ORIGINS }}
            PROD_RESEND_API_KEY=${{ secrets.PROD_RESEND_API_KEY }}
            PROD_SMTP_ADMIN_EMAIL=${{ secrets.PROD_SMTP_ADMIN_EMAIL }}
            EOF

      - name: Deploy to prod server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            cd ~/mockpilot
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --force-recreate

      - name: Deploy Notification
        if: always()
        run: echo "Production deployment completed"
