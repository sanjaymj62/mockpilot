name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose to prod server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          source: "package.json,pnpm-lock.yaml,packages/,apps/,docker-compose.prod.yml,kong.yml"
          target: "~/mockpilot"

      - name: Create prod .env file on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            cd ~/mockpilot
            cat > .env << 'EOF'
            PROD_POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
            PROD_POSTGRES_DB=postgres
            PROD_JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
            PROD_ANON_KEY=${{ secrets.PROD_ANON_KEY }}
            PROD_SERVICE_ROLE_KEY=${{ secrets.PROD_SERVICE_ROLE_KEY }}
            PROD_API_EXTERNAL_URL=https://yourdomain.com
            PROD_SITE_URL=https://yourdomain.com
            PROD_ALLOWED_ORIGINS=https://yourdomain.com
            EOF

      - name: Deploy to prod server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            cd ~/mockpilot
            docker compose -f docker-compose.prod.yml up -d --build

      - name: Deploy Notification
        if: always()
        run: echo "Production deployment completed"
