swagger: "2.0"
info:
  title: Swagger 2.0 API
  version: 1.0.0
  description: A Swagger 2.0 specification for backward compatibility testing

basePath: /api/v1

host: api.legacy.com

schemes:
  - https

paths:
  /articles:
    get:
      summary: List articles
      parameters:
        - name: category
          in: query
          type: string
        - name: page
          in: query
          type: integer
          default: 1
      responses:
        '200':
          description: Article list

    post:
      summary: Create article
      parameters:
        - name: body
          in: body
          schema:
            type: object
            properties:
              title:
                type: string
              content:
                type: string
              author:
                type: string
      responses:
        '201':
          description: Article created

  /articles/{articleId}:
    parameters:
      - name: articleId
        in: path
        required: true
        type: string

    get:
      summary: Get article
      responses:
        '200':
          description: Article details

    put:
      summary: Update article
      parameters:
        - name: body
          in: body
          schema:
            type: object
            properties:
              title:
                type: string
              content:
                type: string
      responses:
        '200':
          description: Article updated

    delete:
      summary: Delete article
      responses:
        '204':
          description: Article deleted

  /auth/login:
    post:
      summary: User login
      parameters:
        - name: credentials
          in: body
          required: true
          schema:
            type: object
            required:
              - username
              - password
            properties:
              username:
                type: string
              password:
                type: string
      responses:
        '200':
          description: Login successful

  /upload:
    post:
      summary: Upload file
      consumes:
        - multipart/form-data
      parameters:
        - name: file
          in: formData
          type: file
          required: true
        - name: description
          in: formData
          type: string
      responses:
        '200':
          description: File uploaded

definitions:
  Article:
    type: object
    properties:
      id:
        type: string
      title:
        type: string
      content:
        type: string
      author:
        type: string
      publishedAt:
        type: string
        format: date-time

  Error:
    type: object
    properties:
      code:
        type: integer
      message:
        type: string
